<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PKUChecklist · 北京大学校园鸟类名录</title><link rel="stylesheet" href="assets/style.css"><body>
<header class="topbar"><div class="container nav"><a class="brandtext" href="./">PKUChecklist</a><a href="PKUChecklist.csv">下载原始 CSV ↗</a></div></header>
<main><section class="hero"><div class="container heroCompact"><div><h1 class="herotitle">北京大学校园鸟类名录</h1><p>持续整理校园鸟类与可追溯的观察记录</p></div><div id="stats" class="heroStats"></div></div></section>
<section class="container"><div class="sectionIntro"><h2>物种名录</h2><span>点击物种查看重要记录</span></div><div class="workspace"><aside class="filterPanel"><div class="smalltitle">筛选<button id="reset" class="clearbtn">重置</button></div><h3 class="fieldname">记录状态</h3><div id="states" class="statefilters"></div><div class="filterDivider"></div><label for="order">目</label><select id="order" class="sel"></select><label for="family">科</label><select id="family" class="sel"></select><p><label><input id="evidenceOnly" type="checkbox"> 仅显示有证据的物种</label></p><p class="subnote">统计包含排除条目；空白状态显示为“未标注”，不代表确认。</p></aside>
<div class="resultsPanel"><div class="toolbar"><input id="search" type="search" placeholder="搜索中文名、学名、英文名、编号或备注…" aria-label="搜索名录" style="width:100%;padding:12px"><div class="toolbarBottom"><span id="count" role="status">正在读取 CSV…</span><label>排序 <select id="sort"><option value="id">分类编号</option><option value="cn_name">中文名</option><option value="sci_name">学名</option><option value="status">状态</option></select></label></div></div><div id="error" role="alert"></div><div id="list"></div></div></div></section></main>
<footer><div class="container footerInner">PKUChecklist · 数据来自项目 CSV <a href="PKURecords.csv">下载重要记录</a></div></footer>
<dialog id="detail" aria-labelledby="detailName"><div class="drawerTop"><span>物种详情</span><button id="close" class="closebtn" aria-label="关闭详情">×</button></div><div id="content" class="drawerScroll"></div></dialog><noscript>请启用 JavaScript 以读取 CSV 和浏览名录。也可直接下载原始 CSV。</noscript><script src="assets/app.js" defer></script></body></html>
